spring:
  application:
    name: pungsaeng
  config:
    import: optional:application-secret.yaml
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  server:
    port: 8080
jwt:
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000