spring:
  application:
    name: pungsaeng
  config:
    import: optional:application-secret.yaml
  profiles:
    # 프로필을 지정하지 않으면 local 로 실행 (운영은 SPRING_PROFILES_ACTIVE=prod 등으로 지정)
    default: local
  sql:
    init:
      mode: always   # MySQL(비내장 DB)에서도 data.sql 실행
      encoding: UTF-8
  jpa:
    hibernate:
      # 기본값은 검증만 - 엔티티와 실제 테이블이 다르면 기동 실패. 스키마 자동 변경은 local 프로필에서만
      ddl-auto: validate
    show-sql: false
    # 테이블 생성(DDL) 이후에 data.sql 실행
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
server:
  port: 8080
jwt:
  # secret 은 application-secret.yaml 에서 주입
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000
cors:
  # 쉼표로 여러 개 지정 가능. 운영은 환경변수 CORS_ALLOWED_ORIGINS 로 덮어쓰기
  allowed-origins: http://localhost:5173